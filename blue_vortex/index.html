<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>الدوامة الزرقاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#0B1220;font-family:'Cairo',system-ui,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.hidden{display:none!important}

/* ===================== HUD ===================== */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#distWrap{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
 text-align:center;min-width:150px}
#dist{font-size:clamp(34px,10.5vw,50px);font-weight:900;color:#eaf4ff;line-height:1.1;
 text-shadow:0 0 18px rgba(24,119,242,.85),0 0 42px rgba(24,119,242,.45)}
#dist small{font-size:.46em;font-weight:700;color:rgba(190,220,255,.72);margin:0 4px}
#spdBar{width:118px;height:5px;margin:6px auto 0;border-radius:99px;background:rgba(120,170,255,.16);overflow:hidden}
#spdFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#1877F2,#5ee0ff);
 box-shadow:0 0 10px rgba(94,224,255,.8);transition:width .18s linear}
#spdLbl{margin-top:3px;font-size:11px;font-weight:700;letter-spacing:.5px;color:rgba(160,200,255,.55)}

.iconBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));width:44px;height:44px;border-radius:14px;
 display:flex;align-items:center;justify-content:center;font-size:19px;color:#cfe6ff;pointer-events:auto;
 background:rgba(20,40,80,.42);border:1px solid rgba(110,170,255,.25);backdrop-filter:blur(8px);
 -webkit-backdrop-filter:blur(8px);cursor:pointer}
.iconBtn:active{transform:scale(.92);background:rgba(30,70,140,.6)}
#btnSound{right:calc(12px + env(safe-area-inset-right))}
#btnPause{left:calc(12px + env(safe-area-inset-left))}

#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,0);font-size:30px;font-weight:900;
 color:#7fe6ff;opacity:0;white-space:nowrap;text-shadow:0 0 20px rgba(94,224,255,.9)}
#toast.show{animation:toastPop 1.25s ease-out forwards}
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}
 18%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}
 35%{transform:translate(-50%,-10px) scale(1)}
 100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}

#flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:#bfe6ff;opacity:0}
#flash.on{animation:fl .5s ease-out forwards}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s ease;
 box-shadow:inset 0 0 130px 12px rgba(24,119,242,.55)}
#vig.on{opacity:1}

/* ===================== SCREENS ===================== */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 pointer-events:auto;text-align:center;
 padding:calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
 background:radial-gradient(ellipse at 50% 42%,rgba(24,119,242,.20),rgba(9,15,30,.90) 58%,rgba(6,10,20,.97))}
.title{font-size:clamp(38px,13vw,62px);font-weight:900;color:#eaf6ff;line-height:1.15;
 text-shadow:0 0 24px rgba(24,119,242,.95),0 0 60px rgba(24,119,242,.55)}
.sub{margin-top:12px;font-size:clamp(15px,4.4vw,19px);font-weight:700;color:rgba(178,212,255,.78);line-height:1.7}
.bigBtn{margin-top:30px;min-width:220px;padding:16px 34px;border:none;border-radius:20px;cursor:pointer;
 font-family:inherit;font-size:22px;font-weight:900;color:#fff;
 background:linear-gradient(160deg,#2b8bf7,#0e5fd0);box-shadow:0 10px 26px rgba(20,90,200,.5),
 inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.3px}
.bigBtn:active{transform:translateY(2px) scale(.98);box-shadow:0 5px 14px rgba(20,90,200,.45)}
.ghostBtn{margin-top:12px;min-width:220px;padding:13px 30px;border-radius:18px;cursor:pointer;font-family:inherit;
 font-size:18px;font-weight:800;color:#bcdcff;background:rgba(30,60,120,.32);
 border:1px solid rgba(120,180,255,.3)}
.ghostBtn:active{transform:translateY(2px) scale(.98);background:rgba(40,80,160,.45)}
.best{margin-top:22px;font-size:16px;font-weight:700;color:rgba(160,200,255,.72)}
.best b{color:#7fe6ff;font-weight:900}
.rowBtns{display:flex;flex-direction:column;align-items:center}

#gameover .bigNum{margin-top:18px;font-size:clamp(46px,15vw,72px);font-weight:900;color:#eaf6ff;line-height:1.1;
 text-shadow:0 0 26px rgba(24,119,242,.9)}
#gameover .bigNum small{font-size:.4em;color:rgba(180,215,255,.7);margin:0 6px}
#gameover .lbl{margin-top:4px;font-size:16px;font-weight:700;color:rgba(170,205,255,.66)}
.newRec{margin-top:10px;display:inline-block;padding:5px 16px;border-radius:99px;font-size:14px;font-weight:900;
 color:#08131f;background:linear-gradient(120deg,#7fe6ff,#38b6ff);box-shadow:0 0 20px rgba(94,224,255,.6)}

/* loading */
#loading{background:#0B1220}
#loadBar{margin-top:22px;width:min(260px,62vw);height:6px;border-radius:99px;background:rgba(120,170,255,.16);
 overflow:hidden}
#loadFill{height:100%;width:0%;background:linear-gradient(90deg,#1877F2,#7fe6ff);border-radius:99px;
 transition:width .12s linear;box-shadow:0 0 12px rgba(94,224,255,.75)}
#loadTxt{margin-top:14px;font-size:17px;font-weight:700;color:rgba(180,215,255,.8)}
.spinner{width:54px;height:54px;border-radius:50%;border:4px solid rgba(120,170,255,.18);
 border-top-color:#3fa9ff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#err{padding:26px;font-size:17px;font-weight:700;color:#ffd0d0;line-height:1.9}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="distWrap"><div id="dist"><span id="distNum">0</span><small>م</small></div>
    <div id="spdBar"><div id="spdFill"></div></div>
    <div id="spdLbl">السرعة</div>
  </div>
  <div id="btnSound" class="iconBtn">🔇</div>
  <div id="btnPause" class="iconBtn">⏸</div>
  <div id="toast"></div>
</div>

<div id="vig"></div>
<div id="flash"></div>

<div id="ui">

  <div id="loading" class="screen">
    <div class="spinner"></div>
    <div id="loadTxt">جاري التحميل</div>
    <div id="loadBar"><div id="loadFill"></div></div>
  </div>

  <div id="start" class="screen hidden">
    <div class="title">الدوامة الزرقاء</div>
    <div class="sub">اسحب يمينًا ويسارًا للمراوغة</div>
    <button id="btnStart" class="bigBtn">ابدأ اللعب</button>
    <div class="best">أفضل مسافة: <b><span id="bestStart">0</span> م</b></div>
    <button id="btnSound2" class="ghostBtn">الصوت: مغلق</button>
  </div>

  <div id="pause" class="screen hidden">
    <div class="title" style="font-size:clamp(30px,9vw,44px)">إيقاف مؤقت</div>
    <div class="sub">المسافة الحالية: <span id="pauseDist">0</span> م</div>
    <div class="rowBtns">
      <button id="btnResume" class="bigBtn">متابعة</button>
      <button id="btnMenu2" class="ghostBtn">القائمة</button>
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <div class="title" style="font-size:clamp(32px,10vw,48px)">انتهت اللعبة</div>
    <div class="bigNum"><span id="goDist">0</span><small>م</small></div>
    <div class="lbl">المسافة</div>
    <div id="goRec" class="newRec hidden">رقم قياسي جديد!</div>
    <div class="best">أفضل مسافة: <b><span id="goBest">0</span> م</b></div>
    <div class="rowBtns">
      <button id="btnRetry" class="bigBtn">إعادة اللعب</button>
      <button id="btnMenu" class="ghostBtn">القائمة</button>
    </div>
  </div>

  <div id="lost" class="screen hidden">
    <div class="title" style="font-size:clamp(28px,8vw,40px)">توقف العرض</div>
    <div class="sub">فُقد سياق الرسوميات مؤقتًا</div>
    <button id="btnRestore" class="bigBtn">متابعة</button>
  </div>

  <div id="fatal" class="screen hidden"><div id="err"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================================================================
   الدوامة الزرقاء — Blue Vortex
   Single file. Three.js r128. Pooled everything. Fixed timestep.
   ================================================================ */

var $ = function(id){ return document.getElementById(id); };
var canvas = $('c');

var elLoading=$('loading'), elStart=$('start'), elPause=$('pause'), elOver=$('gameover'),
    elLost=$('lost'), elFatal=$('fatal'), elHud=$('hud'), elToast=$('toast'),
    elFlash=$('flash'), elVig=$('vig'),
    elDist=$('distNum'), elSpd=$('spdFill'), elLoadFill=$('loadFill'),
    elBestStart=$('bestStart'), elGoDist=$('goDist'), elGoBest=$('goBest'), elGoRec=$('goRec'),
    elPauseDist=$('pauseDist'), elSound=$('btnSound'), elSound2=$('btnSound2');

function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }

if(typeof THREE === 'undefined'){
  hide(elLoading); show(elFatal);
  $('err').textContent = 'تعذّر تحميل المحرك ثلاثي الأبعاد. تحقّق من الاتصال بالإنترنت ثم أعد فتح اللعبة.';
  return;
}

/* ================================ CONFIG ================================ */
var DEG = Math.PI/180, TAU = Math.PI*2;

var CFG = {
  R:           9.0,    // tunnel radius (grid wall)
  RP:          7.35,   // player ride radius
  RO:          7.60,   // obstacle torus centre radius
  TUBE:        0.85,   // obstacle tube radius
  SEG_LEN:     30,     // tunnel grid segment length
  SEG_COUNT:   14,     // recycled segments
  SPAWN_AHEAD: 330,    // spawn distance in front of the camera
  CRAFT_AHEAD: 12,     // craft sits this far in front of the camera
  CAM_OFF:     2.0,    // camera radial offset toward the craft
  V0:          40,     // start speed  (units/s)
  VMAX:        140,    // capped speed
  RAMP:        120,    // seconds to reach VMAX
  FOV0:        75,
  FOV1:        95,
  TAU_THETA:   0.075,  // steering easing (<= 80ms)
  TAU_ROLL:    0.105,  // camera roll lag
  KEY_RATE:    2.6,    // rad/s for keyboard
  NEAR_MISS:   0.20,   // rad clearance that counts as a near miss
  MILESTONE:   500
};

var FIXED = 1/60;
var BG = 0x0B1220;

var C_GRID   = new THREE.Color(0x1877F2);
var C_PULSE  = new THREE.Color(0x7fe6ff);
var C_SHELL  = new THREE.Color(0x0F1626);

/* ================================ STATE ================================ */
var S = {
  mode:'load',           // load | menu | play | pause | over | lost
  dist:0, best:0, v:CFG.V0, t:0,
  theta:0, target:0, camRoll:0, camZ:0,
  bank:0, omega:0,
  shake:0, pulse:0, deadT:0,
  nextSpawnZ:-170, lastType:0,
  muted:true, newRec:false,
  contextLost:false, wasPlaying:false
};

var LS_BEST='blue_vortex_best', LS_SND='blue_vortex_sound';
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

S.best = parseInt(lsGet(LS_BEST,'0'),10) || 0;
S.muted = lsGet(LS_SND,'off') !== 'on';

function norm(a){ a = a % TAU; return a < 0 ? a + TAU : a; }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function rnd(a,b){ return a + Math.random()*(b-a); }

/* ================================ RENDERER ================================ */
var renderer, scene, camera;
try{
  renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
}catch(e){ renderer = null; }
if(!renderer){
  hide(elLoading); show(elFatal);
  $('err').textContent = 'متصفحك لا يدعم WebGL. جرّب متصفحًا آخر أو حدّث النظام.';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(BG, 1);

scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 45, 300);

camera = new THREE.PerspectiveCamera(CFG.FOV0, 1, 0.5, 520);
camera.rotation.order = 'ZYX';
scene.add(camera);

function resize(){
  var w = canvas.clientWidth  || window.innerWidth  || 1;
  var h = canvas.clientHeight || window.innerHeight || 1;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize, false);
window.addEventListener('orientationchange', function(){ resize(); setTimeout(resize,220); setTimeout(resize,520); }, false);
if(window.ResizeObserver){ try{ new ResizeObserver(resize).observe(canvas); }catch(e){} }
resize();

/* ================================ MATERIALS ================================ */
var matGrid = new THREE.LineBasicMaterial({
  color: C_GRID.clone(), transparent:true, opacity:0.95,
  blending: THREE.AdditiveBlending, depthWrite:false, fog:true
});
var matShell = new THREE.MeshBasicMaterial({ color: C_SHELL.clone(), side:THREE.BackSide, fog:true });

var matRing = new THREE.MeshBasicMaterial({ color:0x3fa9ff, fog:true });
var matRot  = new THREE.MeshBasicMaterial({ color:0x9b6cff, fog:true });
var matBar  = new THREE.MeshBasicMaterial({ color:0x2ee6d6, fog:true });
var matRing2= new THREE.MeshBasicMaterial({ color:0x2f7be0, fog:true });

/* ================================ TUNNEL ================================ */
var shell = new THREE.Mesh(
  new THREE.CylinderGeometry(CFG.R+0.35, CFG.R+0.35, 460, 26, 1, true), matShell);
shell.rotation.x = Math.PI/2;
shell.frustumCulled = false;
scene.add(shell);

function buildGridGeo(){
  var pos = [];
  var LINES = 16, RSTEP = 6, RSEG = 32;
  var i,j,a,z;
  // lengthwise lines
  for(i=0;i<LINES;i++){
    a = i/LINES*TAU;
    var x = Math.cos(a)*CFG.R, y = Math.sin(a)*CFG.R;
    pos.push(x,y,0, x,y,-CFG.SEG_LEN);
  }
  // ring lines
  for(z=0; z>-CFG.SEG_LEN; z-=RSTEP){
    for(j=0;j<RSEG;j++){
      var a0 = j/RSEG*TAU, a1 = (j+1)/RSEG*TAU;
      pos.push(Math.cos(a0)*CFG.R, Math.sin(a0)*CFG.R, z,
               Math.cos(a1)*CFG.R, Math.sin(a1)*CFG.R, z);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  return g;
}
var gridGeo = buildGridGeo();
var segs = [];
(function(){
  for(var i=0;i<CFG.SEG_COUNT;i++){
    var m = new THREE.LineSegments(gridGeo, matGrid);
    m.frustumCulled = false;
    scene.add(m);
    segs.push(m);
  }
})();
var TUNNEL_TOTAL = CFG.SEG_COUNT * CFG.SEG_LEN;

function layoutTunnel(){
  for(var i=0;i<segs.length;i++) segs[i].position.z = S.camZ + 40 - i*CFG.SEG_LEN;
}
function recycleTunnel(){
  for(var i=0;i<segs.length;i++){
    var s = segs[i];
    while(s.position.z - CFG.SEG_LEN > S.camZ + 40) s.position.z -= TUNNEL_TOTAL;
  }
}

/* ================================ CRAFT ================================ */
var craftPivot = new THREE.Object3D();
scene.add(craftPivot);

var craft = new THREE.Object3D();
craft.position.set(0, -CFG.RP, 0);
craftPivot.add(craft);

(function buildCraft(){
  // low-poly dart pointing toward -Z
  var v = [
     0.00, 0.00, -1.60,   // 0 nose
    -0.85, 0.00,  0.80,   // 1 left
     0.85, 0.00,  0.80,   // 2 right
     0.00, 0.46,  0.50,   // 3 top
     0.00,-0.16,  0.62    // 4 keel
  ];
  var f = [0,1,3, 0,3,2, 0,2,4, 0,4,1, 1,2,3, 1,4,2];
  var pos = [], col = [];
  var cn = [0.62,0.95,1.0], ct = [0.05,0.35,0.62];
  for(var i=0;i<f.length;i++){
    var k = f[i]*3;
    pos.push(v[k], v[k+1], v[k+2]);
    var tip = (f[i]===0) ? 1 : 0.15;
    col.push(ct[0]+(cn[0]-ct[0])*tip, ct[1]+(cn[1]-ct[1])*tip, ct[2]+(cn[2]-ct[2])*tip);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.DoubleSide, fog:false }));
  m.scale.setScalar(0.82);
  m.frustumCulled = false;
  craft.add(m);

  // bright edge outline (additive)
  var e = [0,1, 0,2, 0,3, 0,4, 1,3, 2,3, 1,4, 2,4, 1,2];
  var ep = [];
  for(var j=0;j<e.length;j++){ var q=e[j]*3; ep.push(v[q],v[q+1],v[q+2]); }
  var eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.Float32BufferAttribute(ep,3));
  var el = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({
    color:0xbdf3ff, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending,
    depthWrite:false, fog:false }));
  el.scale.setScalar(0.84);
  el.frustumCulled = false;
  craft.add(el);
})();

// soft halo sprite (fake glow, no post-processing)
var haloTex = (function(){
  var cv = document.createElement('canvas'); cv.width = cv.height = 128;
  var g = cv.getContext('2d');
  var grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0.00,'rgba(190,245,255,1)');
  grd.addColorStop(0.25,'rgba(90,200,255,0.55)');
  grd.addColorStop(0.60,'rgba(30,110,230,0.16)');
  grd.addColorStop(1.00,'rgba(10,30,80,0)');
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  var t = new THREE.CanvasTexture(cv);
  return t;
})();
var halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map:haloTex, color:0xffffff, blending:THREE.AdditiveBlending,
  depthWrite:false, depthTest:false, transparent:true, fog:false }));
halo.scale.set(4.2,4.2,1);
halo.position.set(0,0,0.2);
craft.add(halo);

/* ---------------- trail ribbon ---------------- */
var TN = 18;
var histA = new Float32Array(TN), histZ = new Float32Array(TN);
var hIdx = 0;
var trailPos = new Float32Array(TN*2*3);
var trailGeo = new THREE.BufferGeometry();
(function(){
  var col = new Float32Array(TN*2*3);
  var idx = [];
  for(var i=0;i<TN;i++){
    var f = 1 - i/(TN-1);
    var r = 0.42*f, g = 0.90*f, b = 1.0*f;
    for(var s=0;s<2;s++){ var o=(i*2+s)*3; col[o]=r; col[o+1]=g; col[o+2]=b; }
  }
  for(var j=0;j<TN-1;j++){
    var a=j*2, b2=j*2+1, c2=j*2+2, d=j*2+3;
    idx.push(a,b2,d, a,d,c2);
  }
  var pa = new THREE.BufferAttribute(trailPos,3); pa.setUsage(THREE.DynamicDrawUsage);
  trailGeo.setAttribute('position', pa);
  trailGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
  trailGeo.setIndex(idx);
})();
var trail = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({
  vertexColors:true, blending:THREE.AdditiveBlending, transparent:true,
  depthWrite:false, side:THREE.DoubleSide, fog:false }));
trail.frustumCulled = false;
scene.add(trail);

function resetTrail(){
  var z = S.camZ - CFG.CRAFT_AHEAD;
  for(var i=0;i<TN;i++){ histA[i] = S.theta; histZ[i] = z + i*0.001; }
  hIdx = 0;
  updateTrail();
}
function pushTrail(){
  hIdx = (hIdx + 1) % TN;
  histA[hIdx] = S.theta;
  histZ[hIdx] = S.camZ - CFG.CRAFT_AHEAD;
}
function updateTrail(){
  for(var i=0;i<TN;i++){
    var k = (hIdx - i + TN*2) % TN;
    var a = histA[k], z = histZ[k];
    var f = 1 - i/(TN-1);
    var w = 0.06 + 0.46*f;
    var r = CFG.RP - 0.06;
    var cx = Math.sin(a)*r, cy = -Math.cos(a)*r;
    var tx = Math.cos(a)*w, ty = Math.sin(a)*w;
    var o = i*2*3;
    trailPos[o]   = cx+tx; trailPos[o+1] = cy+ty; trailPos[o+2] = z;
    trailPos[o+3] = cx-tx; trailPos[o+4] = cy-ty; trailPos[o+5] = z;
  }
  trailGeo.attributes.position.needsUpdate = true;
}

/* ---------------- death particles ---------------- */
var PN = 54;
var pPos = new Float32Array(PN*3), pVel = new Float32Array(PN*3);
var partGeo = new THREE.BufferGeometry();
(function(){
  var pa = new THREE.BufferAttribute(pPos,3); pa.setUsage(THREE.DynamicDrawUsage);
  partGeo.setAttribute('position', pa);
})();
var parts = new THREE.Points(partGeo, new THREE.PointsMaterial({
  color:0x9ff0ff, size:0.55, sizeAttenuation:true, transparent:true, opacity:1,
  blending:THREE.AdditiveBlending, depthWrite:false, fog:false }));
parts.frustumCulled = false;
parts.visible = false;
scene.add(parts);

function burst(){
  var r = CFG.RP, a = S.theta;
  var cx = Math.sin(a)*r, cy = -Math.cos(a)*r, cz = S.camZ - CFG.CRAFT_AHEAD;
  for(var i=0;i<PN;i++){
    var o=i*3;
    pPos[o]=cx; pPos[o+1]=cy; pPos[o+2]=cz;
    var th = Math.random()*TAU, ph = Math.acos(rnd(-1,1)), sp = rnd(3,15);
    pVel[o]   = Math.sin(ph)*Math.cos(th)*sp;
    pVel[o+1] = Math.sin(ph)*Math.sin(th)*sp;
    pVel[o+2] = Math.cos(ph)*sp*0.7 + 6;
  }
  partGeo.attributes.position.needsUpdate = true;
  parts.material.opacity = 1;
  parts.visible = true;
}
function updateParts(dt){
  if(!parts.visible) return;
  for(var i=0;i<PN;i++){
    var o=i*3;
    pPos[o]   += pVel[o]*dt;
    pPos[o+1] += pVel[o+1]*dt;
    pPos[o+2] += pVel[o+2]*dt;
    pVel[o]*=0.94; pVel[o+1]*=0.94; pVel[o+2]*=0.96;
  }
  partGeo.attributes.position.needsUpdate = true;
  parts.material.opacity = Math.max(0, 1 - S.deadT/1.5);
  if(parts.material.opacity <= 0.01) parts.visible = false;
}

/* ================================ ARC GEOMETRY CACHE ================================ */
/* Torus arcs are quantised so a fixed pool of geometries covers every obstacle.
   Collision maths always uses the QUANTISED span, so visuals and logic match. */
var QSTEP = 4*DEG, KMIN = 4, KMAX = 84;
var arcGeos = new Array(KMAX+1);

function quantK(span){ return clamp(Math.ceil(span/QSTEP), KMIN, KMAX); }
function buildArcGeoRange(a,b){
  for(var k=a;k<b && k<=KMAX;k++){
    var span = k*QSTEP;
    var tub = clamp(Math.round(span/(6*DEG)), 4, 58);
    arcGeos[k] = new THREE.TorusGeometry(CFG.RO, CFG.TUBE, 6, tub, span);
  }
}

/* ================================ OBSTACLE POOL ================================ */
var POOL = 18;
var obstacles = [];

function makeObstacle(){
  var g = new THREE.Group();
  g.visible = false;
  g.frustumCulled = false;
  scene.add(g);
  var meshes = [];
  for(var i=0;i<4;i++){
    var m = new THREE.Mesh(arcGeos[KMIN], matRing);
    m.visible = false; m.frustumCulled = false;
    g.add(m); meshes.push(m);
  }
  var planes = [];
  for(var p=0;p<2;p++){
    planes.push({ zOff:0, n:0, passed:false,
      s:new Float64Array(3), sp:new Float64Array(3), k:new Int16Array(3) });
  }
  return { g:g, meshes:meshes, planes:planes, nPlanes:0,
           active:false, z:0, spin:0, rot:0, used:0 };
}
function buildPool(){
  for(var i=0;i<POOL;i++) obstacles.push(makeObstacle());
}
function freeObstacle(){
  for(var i=0;i<obstacles.length;i++) if(!obstacles[i].active) return obstacles[i];
  return null;
}
function clearObstacles(){
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    o.active=false; o.g.visible=false; o.rot=0; o.spin=0; o.g.rotation.z=0;
    for(var j=0;j<4;j++) o.meshes[j].visible=false;
  }
}

/* -------- plane construction -------- */
function addArc(P, start, span){
  if(P.n >= 3) return;
  var k = quantK(span);
  P.s[P.n]  = norm(start);
  P.sp[P.n] = k*QSTEP;   // collision uses the quantised span, so it matches the mesh exactly
  P.k[P.n]  = k;
  P.n++;
  return k;
}
function applyPlane(o, P, mat){
  for(var i=0;i<P.n;i++){
    if(o.used >= 4) break;
    var m = o.meshes[o.used++];
    m.geometry = arcGeos[P.k[i]];
    m.material = mat;
    m.rotation.z = P.s[i] - Math.PI/2;   // theta-space -> polar
    m.position.z = P.zOff;
    m.visible = true;
  }
}
/* gaps given as parallel arrays (sorted ascending, normalised) */
var gS = new Float64Array(3), gSp = new Float64Array(3);
function planeFromGaps(o, pi, zOff, n, mat){
  var P = o.planes[pi];
  P.zOff = zOff; P.passed = false; P.n = 0;
  for(var i=0;i<n;i++){
    var start = norm(gS[i] + gSp[i]);
    var next  = gS[(i+1)%n];
    var span  = norm(next - start);
    if(span < 8*DEG) continue;
    addArc(P, start, span);
  }
  applyPlane(o, P, mat);
}

/* ================================ SPAWNING ================================ */
function pickType(d){
  var r = Math.random();
  if(d > 1200 && S.lastType !== 5 && r < 0.12) return 5;
  if(d > 500){
    if(r < 0.30) return 1;
    if(r < 0.52) return 2;
    if(r < 0.76) return 3;
    return 4;
  }
  if(d > 300){
    if(r < 0.46) return 1;
    if(r < 0.72) return 3;
    return 4;
  }
  if(d > 150) return (r < 0.62) ? 1 : 4;
  return 1;
}

function spawnObstacle(z){
  var o = freeObstacle();
  if(!o) return 0;
  var d = S.dist;
  var type = pickType(d);
  S.lastType = type;

  o.active = true; o.z = z; o.rot = 0; o.spin = 0; o.used = 0;
  o.g.position.z = z; o.g.rotation.z = 0; o.g.visible = true;
  for(var i=0;i<4;i++) o.meshes[i].visible = false;
  o.nPlanes = 1;

  var extra = 0, gap, g0;

  if(type === 1 || type === 3){
    gap = rnd(64*DEG, 110*DEG);
    if(d > 900) gap = rnd(58*DEG, 92*DEG);
    g0 = Math.random()*TAU;
    gS[0]=norm(g0); gSp[0]=gap;
    planeFromGaps(o, 0, 0, 1, type===3 ? matRot : matRing);
    if(type === 3){
      o.spin = (Math.random()<0.5?-1:1) * rnd(0.30, 0.72);
    }
  }
  else if(type === 2){
    gap = rnd(56*DEG, 78*DEG);
    g0 = Math.random()*TAU;
    var a0 = norm(g0), a1 = norm(g0 + Math.PI);
    if(a0 <= a1){ gS[0]=a0; gS[1]=a1; } else { gS[0]=a1; gS[1]=a0; }
    gSp[0]=gap; gSp[1]=gap;
    planeFromGaps(o, 0, 0, 2, matRing);
  }
  else if(type === 4){
    var k = (d > 700 && Math.random() < 0.5) ? 3 : 2;
    var sector = TAU/k;
    var safe = rnd(62*DEG, 88*DEG);
    if(safe > sector - 24*DEG) safe = sector - 24*DEG;
    var base = Math.random()*TAU;
    var P = o.planes[0];
    P.zOff = 0; P.passed = false; P.n = 0;
    for(var b=0;b<k;b++){
      var st = norm(base + b*sector);
      addArc(P, st, sector - safe);
    }
    applyPlane(o, P, matBar);
  }
  else { // 5 : double stack with overlapping gaps
    o.nPlanes = 2;
    var span = rnd(112*DEG, 142*DEG);
    var off  = rnd(42*DEG, span - 38*DEG);
    var base2 = Math.random()*TAU;
    gS[0]=norm(base2); gSp[0]=span;
    planeFromGaps(o, 0, 0, 1, matRing);
    gS[0]=norm(base2 + (Math.random()<0.5?off:-off)); gSp[0]=span;
    planeFromGaps(o, 1, -8, 1, matRing2);
    extra = 16;
  }
  return extra;
}

function spacing(){
  var f = (S.v - CFG.V0)/(CFG.VMAX - CFG.V0);
  var win = 1.50 - 0.60*f;            // 1.5s down to 0.9s reaction window
  var base = Math.max(34, S.v*win);
  return base * rnd(1.0, 1.30);       // jitter only ever widens the window
}

/* ================================ AUDIO ================================ */
var actx = null;
function ensureAudio(){
  if(actx || S.muted) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }catch(e){ actx = null; }
  if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
}
function beep(freq, dur, type, vol){
  if(S.muted || !actx) return;
  try{
    var t = actx.currentTime;
    var osc = actx.createOscillator(), g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.09, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t); osc.stop(t+dur+0.02);
  }catch(e){}
}
function sfxNear(){ beep(880, 0.10, 'sine', 0.05); }
function sfxCrash(){ beep(150, 0.42, 'sawtooth', 0.13); beep(70, 0.55, 'square', 0.10); }
function sfxMile(){ beep(660, 0.10, 'triangle', 0.06); setTimeout(function(){ beep(990,0.14,'triangle',0.06); }, 90); }

}

}

var activeId = null, lastX = 0, keyL = false, keyR = false;

function sensitivity(){
  var w = canvas.clientWidth || window.innerWidth || 360;
  return (Math.PI/2) / (w*0.5);       // half-screen drag ~= 90 degrees
}
function steer(dx){
  if(S.mode !== 'play' && S.mode !== 'menu') return;
  S.target += dx * sensitivity();
}

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  if(activeId === null){
    var t = e.changedTouches[0];
    activeId = t.identifier; lastX = t.clientX;
  }
  ensureAudio();
}, {passive:false});

canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if(t.identifier === activeId){
      steer(t.clientX - lastX);
      lastX = t.clientX;
      break;
    }
  }
}, {passive:false});

function endTouch(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier === activeId){ activeId = null; break; }
  }
}
canvas.addEventListener('touchend', endTouch, {passive:false});
canvas.addEventListener('touchcancel', endTouch, {passive:false});

window.addEventListener('mouseup',   function(){ mDown = false; });

window.addEventListener('keydown', function(e){

/* buttons: touch-first, click fallback guarded against double fire */
function bindBtn(el, fn){
  if(!el) return;
  var t0 = 0;
  el.addEventListener('touchstart', function(e){
    e.preventDefault(); e.stopPropagation();
    t0 = Date.now(); ensureAudio(); fn();
  }, {passive:false});
  el.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if(Date.now() - t0 < 700) return;
    ensureAudio(); fn();
  });
}

/* ================================ TOAST / MILESTONE ================================ */
var milestoneCount = 0;
function toast(txt){
  elToast.textContent = txt;
  elToast.classList.remove('show');
  void elToast.offsetWidth;
  elToast.classList.add('show');
}

/* ================================ SIMULATION ================================ */
function step(dt){
  var playing = (S.mode === 'play');

  if(playing){
    S.t += dt;
    S.v = Math.min(CFG.VMAX, CFG.V0 + (CFG.VMAX - CFG.V0) * (S.t / CFG.RAMP));
  }else{
    S.v = 30;
    S.target += Math.sin(S.camZ*0.004) * 0.004;   // lazy drift on the menu
  }

  // keyboard steering
  if(keyL) S.target -= CFG.KEY_RATE*dt;
  if(keyR) S.target += CFG.KEY_RATE*dt;

  // smoothing
  var prevTheta = S.theta;
  S.theta   += (S.target  - S.theta)   * (1 - Math.exp(-dt/CFG.TAU_THETA));
  S.camRoll += (S.theta   - S.camRoll) * (1 - Math.exp(-dt/CFG.TAU_ROLL));
  S.omega = (S.theta - prevTheta)/dt;
  var bankT = clamp(-S.omega*0.085, -0.55, 0.55);
  S.bank += (bankT - S.bank) * (1 - Math.exp(-dt/0.09));

  // forward motion
  var dz = S.v*dt;
  S.camZ -= dz;
  if(playing) S.dist += dz;

  recycleTunnel();
  pushTrail();

  if(playing){
    // spawn
    var frontier = S.camZ - CFG.SPAWN_AHEAD;
    var guard = 0;
    while(frontier <= S.nextSpawnZ && guard++ < 4){
      var extra = spawnObstacle(S.nextSpawnZ);
      S.nextSpawnZ -= (spacing() + extra);
    }

    // obstacles
    var playerZ = S.camZ - CFG.CRAFT_AHEAD;
    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      if(!o.active) continue;

      if(o.spin){ o.rot += o.spin*dt; o.g.rotation.z = o.rot; }

      for(var p=0;p<o.nPlanes;p++){
        var P = o.planes[p];
        if(P.passed) continue;
        var d = (o.z + P.zOff) - playerZ;
        if(d >= 0){
          P.passed = true;
          testPlane(o, P);
          if(S.mode !== 'play') return;
        }
      }
      if(o.z > S.camZ + 26){
        o.active = false; o.g.visible = false;
        for(var q=0;q<4;q++) o.meshes[q].visible = false;
      }
    }

    // milestones
    var ms = Math.floor(S.dist / CFG.MILESTONE);
    if(ms > milestoneCount){
      milestoneCount = ms;
      S.pulse = 1;
      toast(String(ms*CFG.MILESTONE) + ' م');
      sfxMile();
    }
  }

  if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*2.6);
  if(S.pulse > 0) S.pulse = Math.max(0, S.pulse - dt*0.85);
}

function testPlane(o, P){
  var thL = norm(S.theta - o.rot);
  var clear = 99;
  for(var i=0;i<P.n;i++){
    var s = P.s[i], sp = P.sp[i];
    var rel = norm(thL - s);
    if(rel <= sp){ gameOver(); return; }
    var d1 = norm(s - thL);                 // forward to arc start
    var d2 = norm(thL - (s + sp));          // back from arc end
    if(d1 < clear) clear = d1;
    if(d2 < clear) clear = d2;
  }
  if(clear < CFG.NEAR_MISS){
    S.shake = Math.max(S.shake, 0.42*(1 - clear/CFG.NEAR_MISS) + 0.12);
    sfxNear();
  }
}

/* ================================ RENDER ================================ */
var scratch = new THREE.Color();
var curFov = CFG.FOV0;

function render(dt){
  // camera
  var roll = S.camRoll;
  var sh = S.shake;
  var shx = 0, shy = 0, shr = 0;
  if(sh > 0){
    shx = (Math.random()-0.5)*sh*0.55;
    shy = (Math.random()-0.5)*sh*0.55;
    shr = (Math.random()-0.5)*sh*0.030;
  }
  var off = CFG.CAM_OFF;
  camera.position.set(Math.sin(roll)*off + shx, -Math.cos(roll)*off + shy, S.camZ);
  camera.rotation.set(0, 0, roll + shr);

  // fov easing with speed
  var f = clamp((S.v - CFG.V0)/(CFG.VMAX - CFG.V0), 0, 1);
  var targetFov = CFG.FOV0 + (CFG.FOV1 - CFG.FOV0)*(f*f*(3-2*f));
  curFov += (targetFov - curFov) * Math.min(1, dt*2.2);
  if(Math.abs(curFov - camera.fov) > 0.04){ camera.fov = curFov; camera.updateProjectionMatrix(); }

  // craft
  craftPivot.position.z = S.camZ - CFG.CRAFT_AHEAD;
  craftPivot.rotation.z = S.theta;
  craft.rotation.z = S.bank;
  craft.position.y = -CFG.RP + Math.sin(S.camZ*0.06)*0.045;
  halo.material.opacity = 0.55 + 0.25*f;

  shell.position.z = S.camZ - 180;

  updateTrail();
  updateParts(dt);

  // milestone colour pulse
  if(S.pulse > 0){
    var pw = Math.sin(Math.min(1,S.pulse)*Math.PI);
    scratch.copy(C_GRID).lerp(C_PULSE, pw*0.85);
    matGrid.color.copy(scratch);
    matGrid.opacity = 0.95 + 0.05*pw;
  }else if(!matGrid.color.equals(C_GRID)){
    matGrid.color.copy(C_GRID);
    matGrid.opacity = 0.95;
  }

  renderer.render(scene, camera);
}

/* ================================ HUD ================================ */
var lastShown = -1;
function updateHUD(){
  if(S.mode !== 'play') return;
  var d = Math.floor(S.dist);
  if(d !== lastShown){ elDist.textContent = String(d); lastShown = d; }
  var f = clamp((S.v - CFG.V0)/(CFG.VMAX - CFG.V0), 0, 1);
  elSpd.style.width = (f*100).toFixed(0) + '%';
  if(f > 0.86) elVig.classList.add('on'); else elVig.classList.remove('on');
}

/* ================================ MAIN LOOP ================================ */
var acc = 0, last = 0, hudTick = 0;

function frame(now){
  requestAnimationFrame(frame);
  if(S.contextLost) return;

  var dt = (now - last)/1000;
  last = now;
  if(!(dt > 0)) dt = FIXED;
  if(dt > 0.05) dt = 0.05;              // cap so a stall never teleports the craft

  if(S.mode === 'play' || S.mode === 'menu'){
    acc += dt;
    var steps = 0;
    while(acc >= FIXED && steps < 5){ step(FIXED); acc -= FIXED; steps++; }
    if(acc > FIXED*5) acc = 0;
  }else if(S.mode === 'over'){
    S.deadT += dt;
    S.camZ -= S.v*dt*Math.max(0, 1 - S.deadT*1.6);
    if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*2.2);
    recycleTunnel();
  }

  hudTick += dt;
  if(hudTick > 0.06){ hudTick = 0; updateHUD(); }

  render(dt);
}

/* ================================ LOADING ================================ */
var loadK = KMIN, loadStart = 0;

function loadStep(){
  var t0 = performance.now();
  while(loadK <= KMAX && performance.now() - t0 < 10){
    buildArcGeoRange(loadK, loadK+6);
    loadK += 6;
  }
  var prog = clamp((loadK - KMIN)/(KMAX - KMIN), 0, 1);
  var timed = clamp((performance.now() - loadStart)/450, 0, 1);
  var p = Math.min(prog, 1) * 0.9 + timed*0.1;
  elLoadFill.style.width = (p*100).toFixed(0) + '%';

  if(loadK > KMAX && timed >= 1){
    buildPool();
    elLoadFill.style.width = '100%';
    setTimeout(function(){
      hide(elLoading);
      toMenu();
      last = performance.now();
      requestAnimationFrame(frame);
    }, 120);
    return;
  }
  requestAnimationFrame(loadStep);
}

loadStart = performance.now();
requestAnimationFrame(loadStep);

})();
</script>
