<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFB547">
<title>مطعم البرغر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#FFB547}
body{font-family:'Cairo','Segoe UI',sans-serif;color:#3B2416;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.num{direction:ltr;unicode-bidi:isolate}
.hide{display:none!important}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,36,22,.55);z-index:10;padding:16px}
.card{width:min(340px,100%);background:#FFF6E5;border:3px solid #3B2416;border-radius:22px;padding:20px 16px;text-align:center;box-shadow:0 8px 0 #3B2416}
.card h1{font-size:32px;font-weight:900;color:#D9462B;line-height:1.3}
.card p{margin:6px 0 8px;font-size:14px;color:#6B4A33}
.btn{font-family:inherit;border:3px solid #3B2416;cursor:pointer;border-radius:14px;padding:10px;font-size:19px;font-weight:900;color:#fff;background:#D9462B;width:100%;margin-top:8px;box-shadow:0 4px 0 #3B2416}
.btn.ghost{background:#FFF6E5;color:#3B2416}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3B2416}
.big{font-size:40px;font-weight:900}
#pause{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:5;width:38px;height:38px;border-radius:12px;border:3px solid #3B2416;background:#FFF6E5;color:#3B2416;font-size:14px;font-weight:900}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pause" class="hide">❚❚</button>
<div id="menu" class="ov"><div class="card">
  <h1>مطعم البرغر 🍔</h1>
  <p>الزبائن جائعون! اشوِ اللحم على الشواية، رتّب المكونات بنفس ترتيب الطلب، أغلق بالخبز العلوي ثم المس الزبون لتقديم الطلب. أسرع لتحصل على بقشيش أكبر!</p>
  <p id="bestM"></p>
  <button class="btn" id="startBtn">افتح المطعم</button>
</div></div>
<div id="day" class="ov hide"><div class="card"><h1 id="dayT"></h1><div class="big num" id="dayS"></div><p id="dayP"></p><button class="btn" id="dayBtn"></button><button class="btn ghost hide" id="dayMenu">القائمة</button></div></div>
<div id="pauseOv" class="ov hide"><div class="card"><h1>استراحة</h1><button class="btn" id="resume">متابعة</button></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const W=400,H=720;let scale=1,ox=0,oy=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;scale=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;}
addEventListener('resize',resize);resize();
let ac=null;
function sfx(f,d,t,v,f2){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(v||.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

const ING={patty:{n:'لحم',c:'#7A3E1D',h:12},cheese:{n:'جبن',c:'#FFC93C',h:5},lettuce:{n:'خس',c:'#5DBB46',h:6},tomato:{n:'طماطم',c:'#E8402A',h:6},onion:{n:'بصل',c:'#E9D7F2',h:5},pickle:{n:'مخلل',c:'#8BA83A',h:5}};
const UNLOCK=[['cheese','lettuce'],['tomato'],['onion'],['pickle']];
const COOK=4,BURN=10,DRINK=1.6,FRIES=3,DAYLEN=100;
const SLOTX=[72,200,328];
let state='menu',day=1,time=0,coins=0,dayCoins=0,strikes=0,custs=[null,null,null],nextCust=1,plate=[],closed=false,grill=[null,null,null],drink={s:'idle',t:0},fries={s:'idle',t:0},tray={drink:false,fries:false},texts=[],parts=[],best=0,served=0;
try{best=+localStorage.getItem('br_best')||0;}catch(e){}
$('bestM').innerHTML=best?'أفضل يوم: <span class="num">'+best+'</span>':'';
function avail(){let a=[];for(let i=0;i<Math.min(UNLOCK.length,day);i++)a=a.concat(UNLOCK[i]);return a;}
function target(){return 45+day*30;}
function patience(){return Math.max(30,50-day*3);}
function makeOrder(){
  const a=avail(),n=1+Math.floor(Math.random()*Math.min(4,1+day));
  const stack=['patty'];
  for(let i=0;i<n;i++)stack.push(a[Math.floor(Math.random()*a.length)]);
  if(day>=4&&Math.random()<.35)stack.splice(1+Math.floor(Math.random()*(stack.length-1)),0,'patty');
  // shuffle toppings a little but keep the first patty at the bottom
  const top=stack.slice(1).sort(()=>Math.random()-.5);
  return{stack:['patty',...top],drink:day>=2&&Math.random()<.5,fries:day>=3&&Math.random()<.45};
}
function priceOf(o){return 6+o.stack.length*2+(o.drink?3:0)+(o.fries?3:0);}
function startDay(){time=0;dayCoins=0;strikes=0;custs=[null,null,null];nextCust=1.2;plate=[];closed=false;grill=[null,null,null];drink={s:'idle',t:0};fries={s:'idle',t:0};tray={drink:false,fries:false};texts=[];parts=[];served=0;state='play';$('pause').classList.remove('hide');}
function newGame(){day=1;coins=0;startDay();}
function say(x,y,s,c){texts.push({x,y,s,c:c||'#3B2416',t:1.2});}
/* actions (also used by the autotest bot) */
function addIng(k){if(closed||plate.length>=9){sfx(110,.06,'square',.04);return false;}plate.push(k);sfx(520+plate.length*30,.06,'triangle',.05);return true;}
function rawPatty(){const i=grill.indexOf(null);if(i<0){sfx(110,.06,'square',.04);return false;}grill[i]={t:0};sfx(200,.4,'sawtooth',.03,160);return true;}
function tapGrill(i){const g=grill[i];if(!g)return false;
  if(g.t>=BURN){grill[i]=null;say(SLOTX[i]-0,460,'محروق! 🗑',' #D9462B');sfx(140,.15,'square',.05);return true;}
  if(g.t>=COOK){if(!addIng('patty'))return false;grill[i]=null;return true;}
  sfx(110,.06,'square',.04);return false;}
function closeBurger(){if(closed||plate.length===0)return false;closed=true;sfx(700,.1,'triangle',.06,900);return true;}
function trash(){plate=[];closed=false;tray={drink:false,fries:false};sfx(160,.15,'square',.05,90);}
function tapMachine(m,key){
  if(m.s==='idle'){if(tray[key])return false;m.s='run';m.t=0;sfx(300,.2,'sine',.04,420);return true;}
  if(m.s==='ready'){m.s='idle';tray[key]=true;sfx(800,.08,'triangle',.05);return true;}
  return false;
}
function serve(i){
  const c=custs[i];if(!c||c.leaving)return false;
  if(!closed){say(SLOTX[i],250,'أغلق البرغر أولاً','#D9462B');return false;}
  const o=c.order,ok=plate.length===o.stack.length&&plate.every((k,j)=>k===o.stack[j])&&tray.drink===o.drink&&tray.fries===o.fries;
  if(ok){const tip=Math.round(5*c.p/c.max),pay=priceOf(o)+tip;coins+=pay;dayCoins+=pay;served++;say(SLOTX[i],240,'+'+pay+(tip?' (بقشيش '+tip+')':''),'#2E8B3E');sfx(880,.12,'square',.06,1320);c.mood='happy';
    for(let k=0;k<14;k++){const a=Math.random()*6.28;parts.push({x:SLOTX[i],y:180,vx:Math.cos(a)*120,vy:Math.sin(a)*120-60,t:.8,c:'#FFC93C'});}}
  else{strikes++;say(SLOTX[i],240,'طلب خاطئ! ✗','#D9462B');sfx(150,.35,'sawtooth',.07,70);c.mood='angry';}
  c.leaving=1;plate=[];closed=false;tray={drink:false,fries:false};
  if(strikes>=3)endDay(false);return ok;
}
function update(dt){
  time+=dt;
  for(let i=0;i<3;i++){const c=custs[i];if(!c)continue;
    if(c.leaving){c.leaving-=dt*1.6;if(c.leaving<=0)custs[i]=null;continue;}
    c.enter=Math.min(1,c.enter+dt*2);c.p-=dt;
    if(c.p<=0){strikes++;c.mood='angry';c.leaving=1;say(SLOTX[i],240,'غادر غاضباً!','#D9462B');sfx(150,.35,'sawtooth',.06,70);if(strikes>=3)return endDay(false);}}
  if(time<DAYLEN){nextCust-=dt;if(nextCust<=0){const i=custs.findIndex(c=>!c);if(i>=0){custs[i]={order:makeOrder(),p:patience(),max:patience(),enter:0,mood:'wait',hue:Math.floor(Math.random()*6)};}nextCust=Math.max(5,10-day*.7)+Math.random()*3;}}
  else if(custs.every(c=>!c))return endDay(true);
  for(const g of grill)if(g){g.t+=dt;}
  for(const [m,dur] of [[drink,DRINK],[fries,FRIES]])if(m.s==='run'){m.t+=dt;if(m.t>=dur){m.s='ready';sfx(1000,.08,'sine',.04);}}
  for(const x of texts){x.t-=dt;x.y-=26*dt;}texts=texts.filter(x=>x.t>0);
  for(const p of parts){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}parts=parts.filter(p=>p.t>0);
}
function endDay(ok){
  if(state!=='play')return;
  const passed=ok&&dayCoins>=target();state='day';$('pause').classList.add('hide');
  if(passed&&day>best){best=day;try{localStorage.setItem('br_best',best);}catch(e){}}
  $('dayT').textContent=passed?'نهاية اليوم '+day+' ✓':(strikes>=3?'3 أخطاء — أُغلق المطعم':'لم تبلغ الهدف');
  $('dayS').textContent=dayCoins+' / '+target();
  $('dayP').innerHTML='زبائن سعداء: <span class="num">'+served+'</span>'+(passed&&day<UNLOCK.length+1?' · مكوّن جديد غداً!':'');
  $('dayBtn').textContent=passed?'اليوم التالي':'أعد اليوم';$('dayBtn').dataset.next=passed?'1':'0';
  $('dayMenu').classList.toggle('hide',passed);$('day').classList.remove('hide');
  if(!passed)try{window.FlutterBridge&&FlutterBridge.postMessage('gameOver');}catch(e){}
}

/* ── Drawing ── */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function layer(k,x,y,w,cooked){
  // draws one ingredient centred at x with its bottom at y, returns height used
  const I=ING[k];const h=I.h*w/100;ctx.lineWidth=Math.max(1,w/60);ctx.strokeStyle='#3B2416';
  if(k==='lettuce'){ctx.fillStyle=I.c;ctx.beginPath();ctx.moveTo(x-w*.55,y);for(let i=0;i<=8;i++)ctx.lineTo(x-w*.55+i*w*.1375,y-h-(i%2?h*.5:0));ctx.lineTo(x+w*.55,y);ctx.fill();ctx.stroke();}
  else if(k==='cheese'){ctx.fillStyle=I.c;ctx.beginPath();ctx.moveTo(x-w*.52,y-h);ctx.lineTo(x+w*.52,y-h);ctx.lineTo(x+w*.4,y+h*.8);ctx.lineTo(x+w*.3,y);ctx.lineTo(x-w*.52,y);ctx.closePath();ctx.fill();ctx.stroke();}
  else if(k==='tomato'||k==='onion'||k==='pickle'){const n=k==='pickle'?3:2;for(let i=0;i<n;i++){ctx.fillStyle=I.c;rr(x-w*.46+i*w*.92/n,y-h,w*.92/n-2,h,h/2);ctx.fill();ctx.stroke();}}
  else{ctx.fillStyle=cooked===false?'#C77A6A':I.c;rr(x-w*.5,y-h,w,h,h/2.2);ctx.fill();ctx.stroke();}
  return h;
}
function bun(x,y,w,top){ctx.fillStyle='#E9A23B';ctx.strokeStyle='#3B2416';ctx.lineWidth=Math.max(1,w/60);
  if(top){ctx.beginPath();ctx.ellipse(x,y,w*.52,w*.2,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#FFF2C8';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x-w*.3+i*w*.15,y-w*.1-(i%2)*w*.04,w*.025,w*.012,.4,0,7);ctx.fill();}return w*.2;}
  rr(x-w*.5,y-w*.09,w,w*.09,w*.04);ctx.fill();ctx.stroke();return w*.09;}
function drawBurger(x,y,w,stack,isClosed){let yy=y;yy-=bun(x,yy,w,false);for(const k of stack)yy-=layer(k,x,yy,w)+w*.005;if(isClosed)bun(x,yy,w,true);}
function drawCust(c,x,now){
  const e=c.leaving?c.leaving:c.enter,y=200+(1-e)*60;ctx.globalAlpha=Math.max(0,Math.min(1,e));
  const skin=['#F2C9A0','#D9A27A','#A8714F','#F5D5B8','#C68B5E','#8D5B3D'][c.hue],shirt=['#4A90D9','#9B59B6','#2ECC71','#E67E22','#E74C3C','#1ABC9C'][c.hue];
  ctx.fillStyle=shirt;rr(x-32,y-10,64,60,22);ctx.fill();ctx.strokeStyle='#3B2416';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(x,y-30,24,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#3B2416';const m=c.mood;
  ctx.beginPath();ctx.arc(x-8,y-33,3,0,7);ctx.arc(x+8,y-33,3,0,7);ctx.fill();
  ctx.lineWidth=2.5;ctx.beginPath();if(m==='happy')ctx.arc(x,y-24,8,.2,Math.PI-.2);else if(m==='angry'||c.p<c.max*.25)ctx.arc(x,y-16,7,Math.PI+.3,-.3);else{ctx.moveTo(x-6,y-21);ctx.lineTo(x+6,y-21);}ctx.stroke();
  if(m==='angry'){ctx.strokeStyle='#D9462B';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+14,y-56);ctx.lineTo(x+22,y-48);ctx.moveTo(x+22,y-56);ctx.lineTo(x+14,y-48);ctx.stroke();}
  // ticket
  if(!c.leaving){ctx.fillStyle='#FFFDF6';ctx.strokeStyle='#3B2416';ctx.lineWidth=2;rr(x-52,52,104,92,10);ctx.fill();ctx.stroke();
    drawBurger(x-12,130,52,c.order.stack,true);
    if(c.order.drink){ctx.fillStyle='#E8402A';rr(x+22,98,18,28,4);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(x+29,90,3,10);}
    if(c.order.fries){ctx.fillStyle='#FFC93C';for(let i=0;i<4;i++)ctx.fillRect(x+21+i*4,64+(i%2)*4,3,16);ctx.fillStyle='#D9462B';rr(x+20,78,20,16,3);ctx.fill();ctx.stroke();}
    const f=Math.max(0,c.p/c.max);ctx.fillStyle='#E7D7C0';ctx.fillRect(x-44,134,88,6);ctx.fillStyle=f>.5?'#5DBB46':f>.25?'#FFC93C':'#E8402A';ctx.fillRect(x-44,134,88*f,6);}
  ctx.globalAlpha=1;
}
const BTN=[];
function layoutButtons(){
  BTN.length=0;
  for(let i=0;i<3;i++)BTN.push({id:'grill'+i,x:20+i*92,y:430,w:84,h:62});
  BTN.push({id:'raw',x:300,y:430,w:84,h:62});
  const a=['cheese','lettuce','tomato','onion','pickle'];a.forEach((k,i)=>BTN.push({id:'ing:'+k,x:12+i*76,y:508,w:70,h:66,k}));
  BTN.push({id:'top',x:12,y:590,w:110,h:66});BTN.push({id:'drink',x:132,y:590,w:120,h:66});BTN.push({id:'fries',x:262,y:590,w:126,h:66});
  BTN.push({id:'trash',x:12,y:300,w:52,h:52});
  for(let i=0;i<3;i++)BTN.push({id:'cust'+i,x:SLOTX[i]-52,y:52,w:104,h:210});
}
layoutButtons();
function draw(dt,now){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#FFB547';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
  // wall + counter
  ctx.fillStyle='#FFE0A8';ctx.fillRect(0,0,W,262);for(let x=0;x<W;x+=40){ctx.fillStyle=x%80?'#FFD48A':'#FFE0A8';ctx.fillRect(x,0,40,262);}
  ctx.fillStyle='#C4532F';ctx.fillRect(0,250,W,22);ctx.fillStyle='#8E3B1F';ctx.fillRect(0,268,W,6);
  ctx.fillStyle='#F3E3C3';ctx.fillRect(0,274,W,446);
  if(state==='menu')return;
  custs.forEach((c,i)=>{if(c)drawCust(c,SLOTX[i],now);});
  // HUD
  ctx.fillStyle='#3B2416';ctx.font='900 15px Cairo';ctx.textAlign='center';ctx.textBaseline='middle';
  const left=Math.max(0,DAYLEN-time);ctx.fillText('اليوم '+day+'   ·   '+dayCoins+' / '+target()+'   ·   '+(left>0?Math.ceil(left)+' ث':'آخر الزبائن'),W/2+10,22);
  for(let i=0;i<3;i++){ctx.fillStyle=i<strikes?'#D9462B':'rgba(59,36,22,.2)';ctx.font='900 16px Cairo';ctx.fillText('✗',W-18-i*18,22);}
  // plate + tray
  ctx.fillStyle='#fff';ctx.strokeStyle='#3B2416';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(170,402,92,16,0,0,7);ctx.fill();ctx.stroke();
  drawBurger(170,398,140,plate,closed);
  ctx.fillStyle='#B5835A';rr(276,350,110,64,10);ctx.fill();ctx.stroke();
  if(tray.drink){ctx.fillStyle='#E8402A';rr(292,364,24,38,5);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(301,354,3,12);}
  if(tray.fries){ctx.fillStyle='#FFC93C';for(let i=0;i<5;i++)ctx.fillRect(334+i*5,360+(i%2)*5,4,20);ctx.fillStyle='#D9462B';rr(332,378,30,24,4);ctx.fill();ctx.stroke();}
  // buttons
  for(const b of BTN){
    if(b.id.startsWith('cust'))continue;
    let label='',on=true,fill='#FFF6E5';
    if(b.id.startsWith('grill')){const g=grill[+b.id[5]];fill='#4A4A52';ctx.fillStyle=fill;rr(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.strokeStyle='#3B2416';ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle='#777';ctx.lineWidth=2;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(b.x+6,b.y+i*12.4);ctx.lineTo(b.x+b.w-6,b.y+i*12.4);ctx.stroke();}
      if(g){const cooked=g.t>=COOK,burnt=g.t>=BURN;ctx.fillStyle=burnt?'#222':cooked?'#7A3E1D':'#C77A6A';rr(b.x+12,b.y+18,b.w-24,22,10);ctx.fill();ctx.strokeStyle='#3B2416';ctx.stroke();
        if(!cooked){ctx.fillStyle='#FFC93C';ctx.fillRect(b.x+10,b.y+b.h-10,(b.w-20)*g.t/COOK,5);}
        else if(!burnt){ctx.fillStyle='#E8402A';ctx.fillRect(b.x+10,b.y+b.h-10,(b.w-20)*(1-(g.t-COOK)/(BURN-COOK)),5);if(Math.sin(now/120)>0){ctx.fillStyle='#fff';ctx.font='900 12px Cairo';ctx.fillText('جاهز!',b.x+b.w/2,b.y+10);}}
        else{ctx.fillStyle='#fff';ctx.font='900 12px Cairo';ctx.fillText('محروق 🗑',b.x+b.w/2,b.y+10);}
        if(!burnt&&Math.random()<.3)parts.push({x:b.x+20+Math.random()*(b.w-40),y:b.y+16,vx:0,vy:-40,t:.5,c:'rgba(255,255,255,.5)'});}
      continue;}
    ctx.fillStyle=fill;rr(b.x,b.y,b.w,b.h,12);ctx.fill();ctx.strokeStyle='#3B2416';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#3B2416';ctx.font='900 13px Cairo';
    if(b.id==='raw'){layer('patty',b.x+b.w/2,b.y+36,56,false);ctx.fillStyle='#3B2416';ctx.fillText('لحم نيء',b.x+b.w/2,b.y+b.h-12);}
    else if(b.k){const un=avail().includes(b.k);ctx.globalAlpha=un?1:.25;layer(b.k,b.x+b.w/2,b.y+34,52);ctx.fillStyle='#3B2416';ctx.fillText(un?ING[b.k].n:'🔒',b.x+b.w/2,b.y+b.h-12);ctx.globalAlpha=1;}
    else if(b.id==='top'){bun(b.x+b.w/2,b.y+38,70,true);ctx.fillStyle='#3B2416';ctx.fillText('إغلاق',b.x+b.w/2,b.y+b.h-12);}
    else if(b.id==='trash'){ctx.font='900 22px Cairo';ctx.fillText('🗑',b.x+b.w/2,b.y+b.h/2+2);}
    else{const m=b.id==='drink'?drink:fries,dur=b.id==='drink'?DRINK:FRIES,un=b.id==='drink'?day>=2:day>=3;ctx.globalAlpha=un?1:.3;
      if(b.id==='drink'){ctx.fillStyle='#5A6B7A';rr(b.x+10,b.y+8,40,40,6);ctx.fill();ctx.fillStyle='#E8402A';const lv=m.s==='run'?m.t/dur:m.s==='ready'?1:0;rr(b.x+62,b.y+44-28*lv,22,28*lv+2,3);ctx.fill();ctx.strokeStyle='#3B2416';ctx.lineWidth=2;ctx.strokeRect(b.x+62,b.y+14,22,32);}
      else{ctx.fillStyle='#5A6B7A';rr(b.x+8,b.y+20,50,28,6);ctx.fill();ctx.fillStyle='#FFC93C';const lv=m.s==='run'?m.t/dur:m.s==='ready'?1:0;for(let i=0;i<5;i++)ctx.fillRect(b.x+70+i*6,b.y+40-18*lv-(i%2)*3,4,8+18*lv);ctx.fillStyle='#D9462B';rr(b.x+66,b.y+34,34,14,3);ctx.fill();}
      ctx.fillStyle='#3B2416';ctx.fillText(!un?'🔒':m.s==='ready'?'خذ ✓':m.s==='run'?'...':(b.id==='drink'?'مشروب':'بطاطس'),b.x+b.w/2,b.y+b.h-10);ctx.globalAlpha=1;}
  }
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.t*2);ctx.font='900 16px Cairo';ctx.strokeStyle='#FFF6E5';ctx.lineWidth=5;ctx.strokeText(x.s,x.x,x.y);ctx.fillStyle=x.c.trim();ctx.fillText(x.s,x.x,x.y);}ctx.globalAlpha=1;
  if(time<6&&day===1){ctx.fillStyle='rgba(59,36,22,.75)';ctx.font='700 13px Cairo';ctx.fillText('اشوِ اللحم ← رتّب المكونات ← أغلق ← المس الزبون',W/2,682);}
}
let last=performance.now();
function loop(now){const dt=Math.max(.001,Math.min(.033,(now-last)/1000));last=now;if(state==='play')update(dt);draw(dt,now);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;const x=(e.clientX-ox)/scale,y=(e.clientY-oy)/scale;
  const b=BTN.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(!b)return;
  if(b.id.startsWith('grill'))tapGrill(+b.id[5]);
  else if(b.id==='raw')rawPatty();
  else if(b.k){if(avail().includes(b.k))addIng(b.k);}
  else if(b.id==='top')closeBurger();
  else if(b.id==='drink'){if(day>=2)tapMachine(drink,'drink');}
  else if(b.id==='fries'){if(day>=3)tapMachine(fries,'fries');}
  else if(b.id==='trash')trash();
  else if(b.id.startsWith('cust'))serve(+b.id[4]);
});
$('startBtn').onclick=()=>{$('menu').classList.add('hide');sfx(440,.05);newGame();};
$('dayBtn').onclick=()=>{$('day').classList.add('hide');if($('dayBtn').dataset.next==='1')day++;else coins-=dayCoins;startDay();};
$('dayMenu').onclick=()=>{$('day').classList.add('hide');$('bestM').innerHTML=best?'أفضل يوم: <span class="num">'+best+'</span>':'';$('menu').classList.remove('hide');state='menu';};
$('pause').onclick=()=>{if(state==='play'){state='paused';$('pauseOv').classList.remove('hide');}};
$('resume').onclick=()=>{$('pauseOv').classList.add('hide');state='play';last=performance.now();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='paused';$('pauseOv').classList.remove('hide');}});
if(location.hash==='#autostart'){
  // a bot acting every 0.55s (relaxed human pace) must pass days 1-6; an idle player must fail day 1
  function botStep(){
    const live=custs.map((c,i)=>({c,i})).filter(o=>o.c&&!o.c.leaving&&o.c.enter>=1).sort((a,b)=>a.c.p-b.c.p);
    if(!live.length)return;const {c,i}=live[0],o=c.order;
    // wrong plate? throw away
    if(plate.some((k,j)=>k!==o.stack[j])||plate.length>o.stack.length){trash();return;}
    if(o.drink&&!tray.drink&&drink.s!=='run'){tapMachine(drink,'drink');return;}
    if(o.fries&&!tray.fries&&fries.s!=='run'){tapMachine(fries,'fries');return;}
    const gi=grill.findIndex(g=>g&&g.t>=BURN);if(gi>=0){tapGrill(gi);return;}
    if(!closed&&plate.length<o.stack.length){const need=o.stack[plate.length];
      if(need==='patty'){const ci=grill.findIndex(g=>g&&g.t>=COOK&&g.t<BURN);if(ci>=0){tapGrill(ci);return;}
        const pending=o.stack.slice(plate.length).filter(k=>k==='patty').length;if(grill.filter(g=>g).length<pending){rawPatty();return;}return;}
      addIng(need);return;}
    if(!closed){closeBurger();return;}
    if((o.drink&&!tray.drink)||(o.fries&&!tray.fries))return;
    serve(i);
  }
  const results=[];
  for(let d=1;d<=6;d++){day=d;startDay();let f=0,acc=0;while(state==='play'&&f<60*(DAYLEN+120)){acc+=1/60;if(acc>=.55){acc=0;botStep();}update(1/60);f++;}
    results.push(d+':'+dayCoins+'/'+target()+(strikes?'x'+strikes:''));if(!(dayCoins>=target()&&strikes<3))results[results.length-1]+='!';}
  day=1;startDay();let g=0;while(state==='play'&&g<60*(DAYLEN+60)){update(1/60);g++;}const idleFail=state==='day'&&!(dayCoins>=target());
  const ok=results.every(r=>!r.endsWith('!'))&&idleFail;
  console.log('AUTOTEST burger days='+results.join(' ')+' idleFail='+idleFail+(ok?'':' FAIL'));
  state='menu';$('day').classList.add('hide');$('pause').classList.add('hide');
}
})();
